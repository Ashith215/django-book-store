{% extends 'main.html' %}
{% block body_block %}

{% for item in user_products %}

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <img src="{{item.product.image.url}}" alt="Not Available"  class="img-fluid product-img">   
        </div>
        <div class="col=md-6">
            <h2>{{item.product.name}}</h2>   
            <h2>Amount: {{item.product.price}}</h2>  
            <h2>{{item.product.description}}</h2>  
            <div>
                <p>Quantity: {{item.product.count}}</p>
                <!-- <button class="btn btn-outline-secondary" id="decrementBtn">-</button> -->
                <!-- <input class="form-control text-center" value="{{item.cart_count}}" id="inputBtn"> -->
                <div class="form-control text-center" id="inputBtn">
                    {{item.cart_count}}
                </div>
                <!-- <button class="btn btn-outline-secondary" id="incrementBtn">+</button> -->
            </div> <br> &emsp;&nbsp;
            <a href="{% url 'edit_cartitem' id=item.id %}" class="btn btn-primary">Edit</a> &emsp;&nbsp;
            <a href="{% url 'removecart' id=item.id %}" class="btn btn-primary">Remove</a>
        </div>
    </div>
</div>

{% endfor %}

{% endblock %}
